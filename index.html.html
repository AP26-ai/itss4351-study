<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITSS 4351 Midterm Study</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f0eee8; --ink:#1c1c1e; --ink-2:#3a3a3e; --muted:#6c6b70; --line:#e2dfd7;
  --accent:#2d5b86; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --ok:#1d7446; --ok-bg:#e5f3ea; --ok-line:#9fd3b3;
  --bad:#b0271d; --bad-bg:#fbe8e5; --bad-line:#eeb0a8;
  --warn:#9a6200;
  --lv-unseen:#d8d4cb; --lv-0:#d9695f; --lv-1:#e2a93b; --lv-2:#5b93c7; --lv-ret:#2f8f5b;
  --heavy:#8a3b12; --heavy-bg:#fbe9dc;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --serif:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1d1e22; --surface-2:#25262b; --ink:#ececef; --ink-2:#c9c9cf; --muted:#9a9aa3; --line:#33343a;
    --accent:#8fb8e3; --accent-ink:#10161d; --accent-soft:#1f2d3b;
    --ok:#6fd49c; --ok-bg:#15301f; --ok-line:#2d6a45;
    --bad:#f4938a; --bad-bg:#3a1c19; --bad-line:#7a3a33;
    --warn:#e6b35c;
    --lv-unseen:#3a3b41; --lv-0:#d2685e; --lv-1:#d9a441; --lv-2:#6aa3d6; --lv-ret:#4fb67d;
    --heavy:#f3b58c; --heavy-bg:#3a2518;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1d1e22; --surface-2:#25262b; --ink:#ececef; --ink-2:#c9c9cf; --muted:#9a9aa3; --line:#33343a;
  --accent:#8fb8e3; --accent-ink:#10161d; --accent-soft:#1f2d3b;
  --ok:#6fd49c; --ok-bg:#15301f; --ok-line:#2d6a45;
  --bad:#f4938a; --bad-bg:#3a1c19; --bad-line:#7a3a33;
  --warn:#e6b35c;
  --lv-unseen:#3a3b41; --lv-0:#d2685e; --lv-1:#d9a441; --lv-2:#6aa3d6; --lv-ret:#4fb67d;
  --heavy:#f3b58c; --heavy-bg:#3a2518;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-top:14px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0;letter-spacing:.005em}
.brand .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.brand .meta b{color:var(--ink-2);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.iconbtn:hover{background:var(--surface-2)}

/* progress */
.prog{padding:10px 0 10px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--lv-unseen)}
.bar span{display:block;height:100%;transition:width .35s ease}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .ret{margin-left:auto;color:var(--ink);font-weight:600}

/* tabs */
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin:0 -16px;padding:0 16px}
nav.tabs button{border:0;background:none;padding:10px 12px 11px;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .sep{width:1px;background:var(--line);margin:10px 6px;flex:0 0 1px}

main.wrap{padding-top:24px;padding-bottom:60px}
@media (max-width:700px){header.top{position:static}.brand h1{font-size:1.12rem}.hrow{padding-top:10px}}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:.86rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ctl{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;color:var(--ink-2);cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--ink);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:.88rem}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px}
@media (max-width:560px){.card{padding:18px}}
.cardhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.76rem;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;text-transform:none;letter-spacing:0;font-size:.76rem;color:var(--ink-2);background:var(--surface-2)}
.pill.heavy{background:var(--heavy-bg);color:var(--heavy);border-color:transparent;font-weight:600}
.pill.rev{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.dots{display:inline-flex;gap:3px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--lv-unseen)}
.dots i.on{background:var(--lv-ret)}
.prompt{font-family:var(--serif);font-size:1.32rem;line-height:1.45;margin:0 0 20px;color:var(--ink)}
@media (max-width:560px){.prompt{font-size:1.16rem}}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;font-size:1rem;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:0 0 24px;height:24px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:.8rem;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.fillrow{display:flex;gap:10px}
.fillrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;font-size:1.05rem}
.fillrow input:focus{border-color:var(--accent);outline:none}
.fillrow input.right{border-color:var(--ok);background:var(--ok-bg)}
.fillrow input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:600;font-size:.95rem}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:.84rem}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink-2);font-weight:500}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.hint kbd{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}

/* feedback */
.fb{margin-top:18px;border-radius:12px;padding:16px 18px;border:1.5px solid;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.985);opacity:0}to{transform:none;opacity:1}}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.no{background:var(--bad-bg);border-color:var(--bad-line)}
.fb .verdict{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:700;font-family:var(--serif)}
.fb.ok .verdict{color:var(--ok)}
.fb.no .verdict{color:var(--bad)}
.fb .mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--surface);font-size:1.05rem;flex:0 0 32px}
.fb.ok .mark{background:var(--ok)}
.fb.no .mark{background:var(--bad)}
.fb .ans{margin-top:8px;font-size:1rem}
.fb .ans b{font-weight:700}
.fb .sub{margin-top:6px;font-size:.86rem;color:var(--ink-2)}
.fb .why{margin-top:10px;font-size:.92rem;color:var(--ink-2);line-height:1.55}
.fb .src{margin-top:8px;font-size:.76rem;color:var(--muted)}
.nextrow{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px}

/* matching */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media (max-width:640px){.mgrid{gap:8px}}
.mcol{display:grid;gap:8px;align-content:start}
.mcol h4{margin:0 0 2px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-size:.9rem;line-height:1.38;min-height:44px;transition:border-color .12s,background .12s}
.mi:hover:not(:disabled){border-color:var(--accent)}
.mi.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.mi.done{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ink-2);cursor:default}
.mi.done.missed{border-color:var(--bad-line);background:var(--bad-bg)}
.mi.shake{animation:shake .32s ease;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mi.ans{font-weight:600}
@media (max-width:640px){.mi{font-size:.84rem;padding:9px 10px}}
.mfb{margin-top:14px;min-height:0}

/* side */
aside .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
aside h3,.panel h3{font-family:var(--serif);font-size:1.08rem;margin:0 0 4px}
.panel .sub{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.weak{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px;max-height:380px;overflow:auto}
.weak li{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.82rem;line-height:1.4}
.weak .wq{color:var(--ink-2)}
.weak .wa{font-weight:600;margin-top:3px}
.weak .wn{float:right;color:var(--bad);font-weight:700;font-size:.78rem;margin-left:8px}
.empty{font-size:.85rem;color:var(--muted);padding:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:last-child{text-align:right;color:var(--muted);white-space:nowrap;padding-left:8px}
.mini{height:6px;border-radius:3px;background:var(--lv-unseen);overflow:hidden;display:flex;margin-top:4px}
.mini span{height:100%}
.hv{font-size:.66rem;font-weight:700;color:var(--heavy);background:var(--heavy-bg);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}

/* activities */
.acthead h2,.notes h2{font-family:var(--serif);font-size:1.5rem;margin:0}
.acthead .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.acthead .note{margin:14px 0 18px;font-size:.9rem;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 14px;border-left:3px solid var(--accent)}
.qcount{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.qbar{height:4px;background:var(--surface-2);border-radius:2px;margin-bottom:18px;overflow:hidden}
.qbar span{display:block;height:100%;background:var(--accent)}
.score{font-family:var(--serif);font-size:2.4rem;font-weight:600;margin:0}
.review{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.review li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem}
.review li.miss{border-color:var(--bad-line);background:var(--bad-bg)}
.review .rq{color:var(--ink-2)}
.review .ra{font-weight:600;margin-top:4px}
.review .rw{color:var(--muted);font-size:.82rem;margin-top:4px}
.best{font-size:.8rem;color:var(--muted)}

/* notes */
.notes section{margin-top:22px}
.notes h3{font-family:var(--serif);font-size:1.12rem;margin:0 0 8px}
.notes ul{margin:0;padding-left:20px}
.notes li{margin:6px 0;font-size:.93rem;color:var(--ink-2)}
.srcs{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
.srcs th,.srcs td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.srcs th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.srcs td:last-child,.srcs th:last-child{text-align:right}
.danger{color:var(--bad);border-color:var(--bad-line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="hrow">
      <div class="brand">
        <h1>ITSS 4351 · Midterm Study</h1>

      <button class="iconbtn" id="themeBtn" type="button" title="Switch light / dark">Theme: Auto</button>

</header>
<main class="wrap" id="main"></main>

    why: "F26 OLTP vs DW table: data latency is 'Real-time' for OLTP but 'Periodic snapshots, including history' for the warehouse. The ODS is 'a staging area that also allows queries, for analysis that needs near-real-time data.' Querying the live system directly 'slows down the checkout line.' The hint on the slide is 'latency vs. history.'" },
  { q: "A report shows revenue of $4.2M. A manager asks where that number came from. Which layer answers the question?",
    o: ["Metadata", "The staging area", "The warehouse core", "The data marts"], c: 0,
    why: "F26: 'Metadata describes every arrow in this diagram. Without it nobody can trace where a number came from.' Metadata 'identifies and defines every element: source, transformation, storage, usage, history. This is what makes a number auditable.'" },
  { q: "A 60-person firm needs marketing reporting live within six weeks and has one data engineer. Which architecture fits, and what do you give up?",
    o: ["Independent data marts. You give up a single version of the truth", "Hub-and-spoke. You give up nothing", "Centralized warehouse. You give up governance", "Federated. You give up a physical store"], c: 0,
    why: "F26 five-architectures table: independent data marts are 'Fast to stand up; no single version of the truth.' Hub-and-spoke is 'slower and costlier to start.' One department, six weeks and one engineer all point to speed. The slide asks you to 'name the trade-off explicitly.'" },
  { q: "Finance and Sales each built their own independent mart. Both report 'revenue' and the numbers disagree by 3%. What went wrong?",
    o: ["Each mart has its own ETL and definitions, which rebuilds the silo problem one layer up", "The marts were built from the EDW", "The warehouse was not time-variant", "The marts used a star schema"], c: 0,
    why: "F26 Dependent vs Independent slide: 'Independent marts are quicker. Build several of them and you have rebuilt the silo problem from the start of this session, one layer up.' Silos = 'sales, marketing and finance use different words for the same customer.'" },
  { q: "Same scenario: which mart type fixes it?",
    o: ["Dependent", "Independent", "Virtual", "Hybrid"], c: 0,
    why: "F26 four-kinds table: Dependent marts draw 'directly from a central data warehouse.' Use them when 'an EDW already exists and you want consistency.' The review adds that a dependent mart 'inherits the EDW's model and definitions', so both marts would share one definition of revenue." },
  { q: "Your team wants to keep five years of raw clickstream JSON 'in case we need it later.' Warehouse or lake?",
    o: ["Data lake", "Data warehouse", "Data mart", "ODS"], c: 0,
    why: "F26 warehouse vs lake table: a lake holds 'any data in raw or native format', is 'designed for low-cost storage', and is schema-on-read, so you transform 'before analysis.' A warehouse wants 'structured, processed' data transformed 'before entering the warehouse.'" }

 id: "im3", title: "Ch. 3 Review Questions", sub: "Instructor Manual answer key", src: "IM3",
 note: "Built from the Chapter 3 instructor manual, which contains the textbook's answer key. The wrong options are true statements taken from other answers in the manual.",
 type: "mc",
 qs: [
  { q: "How does a data warehouse differ from a database?",
    o: ["It is a database, but highly denormalized for performance, which works because its content is never updated, just added to", "It is highly normalized to avoid update anomalies", "It holds only the current values used to run the business", "It is a database from which the business operates on an ongoing basis"], c: 0,
    why: "Manual §3.2 Q2: 'most databases are highly normalized, in part to avoid update anomalies. Data warehouses are highly denormalized for performance reasons. This is acceptable because their content is never updated, just added to.'" },
  { q: "Per the instructor manual, what is an ODS?",
    o: ["The database from which a business operates on an ongoing basis", "An all-encompassing DW covering all subject areas of interest to the entire organization", "A smaller DW designed around one problem, function or topic", "Data about data"], c: 0,
    why: "Manual §3.2 Q3–4. The other options are its definitions of an EDW, a data mart and metadata. Note: your Midterm Review words this differently ('staging for recent operational data on its way in; current, not historical'). Know both." },
  { q: "What is the key difference between a two-tier and a three-tier architecture?",
    o: ["In two-tier, the application and DW reside on the same machine; in three-tier, on separate machines. The user can't see the difference", "Two-tier has no client system", "Three-tier removes the need for ETL", "Users get a different interface in each"], c: 0,
    why: "Manual §3.4 Q1: 'Both provide the same user visibility... in a two-tiered architecture, the application and data warehouse reside on the same machine; in a three-tiered architecture, they are on separate machines.'" },
  { q: "Which data warehousing architecture is the best?",
    o: ["No claim can be made. The bus, hub-and-spoke and centralized architectures scored very similar averages", "Hub-and-spoke, because it has the strongest integration", "Independent data marts, because they are fastest", "Federated, because no new physical store is needed"], c: 0,
    why: "Manual §3.4 Q5, referring to Table 3.1: 'The differences are sufficiently small that no claims can be made for a particular architecture's superiority over the others.'" },
  { q: "Describe data integration.",
    o: ["An umbrella term for accessing the data, combining different views of it, and capturing changes to it", "Extraction, transformation and load", "Consolidation, federation and propagation", "Collect, integrate, store, analyse, present"], c: 0,
    why: "Manual §3.5 Q1: 'Data integration is an umbrella term that covers three processes... accessing the data, combining different views of the data, and capturing changes to the data.' The others are the ETL steps, the three integration techniques, and the BI process." },
  { q: "Why is the ETL process so important for data warehousing?",
    o: ["It is how data gets loaded, so a DW couldn't exist without it, and it contributes to data quality", "It lets users query the sources live without copying data", "It keeps the warehouse in third normal form", "It replaces the need for metadata"], c: 0,
    why: "Manual §3.5 Q3: 'Since ETL is the process through which data are loaded into a data warehouse, a DW could not exist without it. The ETL process also contributes to the quality of the data in a DW.'" },
  { q: "What is a cube?",
    o: ["A multidimensional data structure (actual or virtual) that allows fast analysis of data", "A two-dimensional subset of a multidimensional array", "A slice on more than two dimensions", "A table of numeric measures with foreign keys to dimensions"], c: 0,
    why: "Manual §3.6 Q4. The wrong options are its definitions of a slice and a dice, and the review's definition of a fact table." },
  { q: "How does the manual define dice?",
    o: ["A slice on more than two dimensions of a data cube", "Navigating from the most summarized to the most detailed level", "A subset of a multidimensional array for a single value of one dimension", "Rotating a report's dimensional orientation"], c: 0,
    why: "Manual §3.6 Q4: 'The dice operation is a slice on more than two dimensions of a data cube.' (Your review puts it as 'fix SEVERAL dimensions at once.')" },
  { q: "What are the DW scalability issues?",
    o: ["Amount of data, how quickly it's expected to grow, number of concurrent users, complexity of user queries", "Financial strength, ERP linkages, qualified consultants, market share", "Policies, logical security, physical access, internal control review", "Sponsorship, expectations, politics, data availability"], c: 0,
    why: "Manual §3.7 Q4. The other options are the vendor-selection criteria (§3.6 Q2), the four security areas (§3.8 Q1), and pieces of the risks list (§3.7 Q3)." },
  { q: "When is Kimball's approach most effective?",
    o: ["To provide a 'proof of concept' before a full-scale EDW, or when a well-defined area with the greatest benefits can be identified", "When there's a recognized need for an EDW, an executive champion, and willingness to invest before results", "When the business is stable and wants a unified single source of truth", "When the organization needs very low data redundancy"], c: 0,
    why: "Manual end-of-chapter Q7. The second option is its description of when Inmon's approach works. The last two are the Data Mart slides' reasons to prefer Inmon." },
  { q: "Which is one of the four areas effective DW security should focus on?",
    o: ["Limiting physical access to the data center environment", "Choosing a data warehouse manager who is technology oriented", "Loading the warehouse with information because it is available", "Focusing on ad hoc data mining instead of alerts"], c: 0,
    why: "Manual §3.8 Q1 (Step 3). The other three options come from the manual's list of risks to avoid." },
  { q: "Which is a risk the manual says to avoid when developing a DW?",
    o: ["Believing that your problems are over when the data warehouse is up and running", "Getting senior management support and a project champion", "Having users participate in the development process", "Offloading information processing from costly operational systems"], c: 0,
    why: "Manual §3.7 Q3 risk list. The other options are implementation guidelines (§3.7 Q2) and a DW benefit (§3.6 Q1)." },
  { q: "When can a data mart replace a data warehouse?",
    o: ["When all the analyses the DW would be used for can be satisfied by the mart (or several marts)", "When the mart handles some analyses but not all", "Whenever a department wants faster queries", "Never; a mart always requires an EDW"], c: 0,
    why: "Manual discussion Q3. If the mart handles only some analyses, it complements the DW instead." },
  { q: "The manual's six criteria for selecting a DW vendor are:",
    o: ["Financial strength, ERP linkages, qualified consultants, market share, industry experience, established partnerships", "Product functionality, strategic vision, customer references, price, support, training", "Amount of data, growth rate, concurrent users, query complexity, security, cost", "Sponsorship, expectations, politics, design, management, external data"], c: 0,
    why: "Manual §3.6 Q2. (It mentions product functionality, strategic vision and customer references as criteria 'one could add'.)" },
  { q: "How has the Web influenced data warehouse design?",
    o: ["Primarily by making Web-based data warehousing possible", "By replacing ETL with data federation", "By removing the need for a staging area", "By requiring snowflake schemas"], c: 0,
    why: "Manual §3.4 Q2: 'Primarily by making Web-based data warehousing possible.'" }
 ]

 id: "gsm", title: "Decision Support Matrix", sub: "Ch. 1 Figure 1.2 (Gorry & Scott-Morton)", src: "CH1",
 note: "Place each decision from Figure 1.2 in its cell. Rows are the degree of structuredness (Simon); columns are the type of control (Anthony).",
 type: "mc",
 qs: (function(){
   const cells = {1:"Structured · Operational control",2:"Structured · Managerial control",3:"Structured · Strategic planning",
     4:"Semistructured · Operational control",5:"Semistructured · Managerial control",6:"Semistructured · Strategic planning",
     7:"Unstructured · Operational control",8:"Unstructured · Managerial control",9:"Unstructured · Strategic planning"};
   const near = {1:[2,4,7],2:[1,5,3],3:[2,6,9],4:[1,5,7],5:[2,4,6],6:[3,5,9],7:[4,8,1],8:[5,7,9],9:[6,8,3]};
   const items = [["Accounts receivable",1],["Order entry",1],["Budget analysis",2],["Make-or-buy",2],["Investment portfolio",3],["Warehouse location",3],
     ["Inventory control",4],["Production scheduling",4],["Credit evaluation",5],["Project scheduling",5],["Mergers & acquisitions",6],["New product planning",6],
     ["Approving loans",7],["Selecting a cover for a magazine",7],["Recruiting an executive",8],["Negotiating",8],["R & D planning",9],["Social responsibility planning",9]];
   return items.map(([d,c]) => ({ q: "Which cell does '" + d + "' belong in?", o: [cells[c]].concat(near[c].map(n=>cells[n])), c: 0,
     why: "Figure 1.2 places '" + d + "' in cell " + c + " (" + cells[c] + ")." + (c===1||c===2||c===4 ? " Cells 1, 2 and 4 are usually handled by lower-level managers." : (c===6||c===8||c===9 ? " Cells 6, 8 and 9 are the responsibility of top executives or highly trained specialists." : "")) }));
 })()
},

<script>
(function(){
"use strict";

/* ---------- utils ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s){
  return String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/&/g, " and ").replace(/%/g, " percent ").replace(/\^/g, " ^ ")
    .replace(/[^a-z0-9^* ]+/g, " ").replace(/\s+/g, " ").trim()

}
function stemTokens(n){ return n.split(" ").map(t => t.length > 3 && t.endsWith("s") ? t.slice(0, -1) : t).join(" "); }
function lev(a, b){
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) { cur[0] = i;
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    [prev, cur] = [cur, prev]; }
  return prev[n];
}
const digits = s => (s.match(/\d+/g) || []).join(",");

/* ---------- storage ---------- */
const KEY = "itss4351-study-v1";
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") return s; } catch (e) {} return null; }
let S = load() || {};
S.items = S.items || {}; S.acts = S.acts || {}; S.turn = S.turn || 0;
S.fmt = S.fmt || "mc"; S.topic = S.topic || "all"; S.rev = !!S.rev; S.weak = !!S.weak; S.theme = S.theme || "auto"; S.tab = S.tab || "drill";
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- build items ---------- */
const ITEMS = []; const BYID = {};
BLOCKS.forEach(([t, g, s, r, rows]) => rows.forEach(row => {
  const [q, a, o] = row; const opt = o || {};
  const id = t + "-" + hash(q);
  const it = { id, t, g, s, r: !!r, q, a, alt: opt.alt || [], kw: opt.kw || null, x: opt.x || "" };
  ITEMS.push(it); BYID[id] = it;
}));
const TOPIC = {}; TOPICS.forEach(t => TOPIC[t.k] = t);
const GROUPS = {};
ITEMS.forEach(it => { (GROUPS[it.g] = GROUPS[it.g] || []).push(it.a); });
function optionsFor(it){
  const seen = new Set([norm(it.a)]); it.alt.forEach(a => seen.add(norm(a)));
  const pool = [];
  shuffle(GROUPS[it.g] || []).concat(shuffle(EXTRAS[it.g] || [])).forEach(a => {
    const n = norm(a); if (!seen.has(n)) { seen.add(n); pool.push(a); }
  });
  return pool.slice(0, 3);
}
const MC_OK = {}; ITEMS.forEach(it => { MC_OK[it.id] = optionsFor(it).length >= 1; });

function rec(id){ return S.items[id] || (S.items[id] = { lv: 0, seen: 0, r: 0, w: 0, due: 0 }); }
function status(id){ const r = S.items[id]; if (!r || !r.seen) return "unseen"; if (r.lv >= 3) return "ret"; return "l" + r.lv; }

/* ---------- grading ---------- */
function variants(it){
  const v = [it.a].concat(it.alt);
  const m = it.a.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if (m) { v.push(m[1]); if (/^[A-Z0-9:\/ ]{2,}$/.test(m[2].trim())) v.push(m[2]); }
  return v;
}
function grade(it, input){
  const n = norm(input); if (!n) return { ok: false };
  if (it.a === "*" && input.trim() === "*") return { ok: true, exact: true };
  for (const v of variants(it)) {
    const nv = norm(v); if (!nv) continue;
    if (n === nv || n.replace(/ /g, "") === nv.replace(/ /g, "") || stemTokens(n) === stemTokens(nv)) return { ok: true, exact: true };
  }
  for (const v of variants(it)) {
    const nv = norm(v); if (nv.length < 4) continue;
    if (digits(n) !== digits(nv)) continue;
    const tol = nv.length <= 6 ? 1 : nv.length <= 12 ? 2 : 3;
    if (lev(n, nv) <= tol || lev(n.replace(/ /g, ""), nv.replace(/ /g, "")) <= tol) return { ok: true, exact: false };
  }
  if (it.kw && it.kw.every(slot => slot.some(k => n.includes(k)))) return { ok: true, exact: false, kw: true };
  return { ok: false };
}

/* ---------- scheduling ---------- */
function priority(it){ return (it.r ? 2 : 0) + (TOPIC[it.t].w === "HEAVY" ? 1 : 0); }
const ORDER = {}; shuffle(ITEMS).sort((a, b) => priority(b) - priority(a)).forEach((it, i) => ORDER[it.id] = i);
function pool(){
  return ITEMS.filter(it => (S.topic === "all" || it.t === S.topic) && (!S.rev || it.r)
    && status(it.id) !== "ret" && (!S.weak || (S.items[it.id] && S.items[it.id].w > 0))
    && (S.fmt !== "mc" || MC_OK[it.id]));
}
let lastId = null;
function pick(p, exclude){
  p = p.filter(it => !exclude.has(it.id)); if (!p.length) return null;
  const alt = p.length > 1 ? p.filter(it => it.id !== lastId) : p;
  const due = alt.filter(it => S.items[it.id] && S.items[it.id].seen && S.items[it.id].due <= S.turn)
    .sort((a, b) => S.items[a.id].due - S.items[b.id].due || S.items[a.id].lv - S.items[b.id].lv);
  if (due.length) return due[Math.floor(Math.random() * Math.min(2, due.length))];
  const fresh = alt.filter(it => !S.items[it.id] || !S.items[it.id].seen).sort((a, b) => ORDER[a.id] - ORDER[b.id]);
  if (fresh.length) return fresh[0];
  return alt.slice().sort((a, b) => S.items[a.id].due - S.items[b.id].due)[0];
}

  const r = rec(id); r.seen = 1; S.turn++;
  if (ok) { r.r++; r.lv = Math.min(3, r.lv + 1); r.due = S.turn + (r.lv === 1 ? 4 : 9); }
  else { r.w++; r.lv = 0; r.due = S.turn + 2; }
  save(); renderProgress(); renderSide();
  return r;
}

/* ---------- header ---------- */
function renderMeta(){
  const exam = new Date(2026, 9, 6); const today = new Date(); today.setHours(0,0,0,0);
  const d = Math.round((exam - today) / 864e5);

  $("#examMeta").innerHTML = "Midterm Tue 10/6" + when + " · UTD Testing Center · register 48 hrs ahead · 2 hrs · one A4 sheet";
}
function applyTheme(){
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
  $("#themeBtn").textContent = "Theme: " + S.theme[0].toUpperCase() + S.theme.slice(1);
}
$("#themeBtn").onclick = () => { S.theme = S.theme === "auto" ? "light" : S.theme === "light" ? "dark" : "auto"; save(); applyTheme(); };

const LV = [["ret","Retired","--lv-ret"],["l2","Level 2","--lv-2"],["l1","Level 1","--lv-1"],["l0","Missed / level 0","--lv-0"],["unseen","Unseen","--lv-unseen"]];
function counts(list){ const c = { ret:0, l2:0, l1:0, l0:0, unseen:0 }; list.forEach(it => c[status(it.id)]++); return c; }
function renderProgress(){
  const c = counts(ITEMS), n = ITEMS.length;
  $("#bar").innerHTML = LV.map(([k,, v]) => '<span style="width:' + (c[k] / n * 100) + '%;background:var(' + v + ')" title="' + k + '"></span>').join("");
  $("#legend").innerHTML = LV.map(([k, l, v]) => '<span><i style="background:var(' + v + ')"></i>' + l + " " + c[k] + "</span>").join("")
    + '<span class="ret">Retired ' + c.ret + " / " + n + "</span>";
}

/* ---------- tabs ---------- */
function renderTabs(){
  const t = [["drill","Drill"]].concat(ACTIVITIES.map(a => ["act-" + a.id, a.title])).concat([["notes","Notes"]]);
  $("#tabs").innerHTML = t.map(([k, l], i) => (i === 1 ? '<span class="sep" aria-hidden="true"></span>' : "") + (k === "notes" ? '<span class="sep" aria-hidden="true"></span>' : "")
    + '<button role="tab" data-k="' + k + '" aria-selected="' + (S.tab === k) + '">' + esc(l) + "</button>").join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { S.tab = b.dataset.k; save(); renderTabs(); route(); });

}
function route(){
  keyHandler = null;

}
let keyHandler = null;
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;

});

/* ---------- drill ---------- */
function renderDrill(){
  const topOpts = ['<option value="all">All topics (' + ITEMS.length + ")</option>"].concat(TOPICS.map(t =>
    '<option value="' + t.k + '"' + (S.topic === t.k ? " selected" : "") + ">" + esc(t.name) + (t.w === "HEAVY" ? " · HEAVY" : "") + " (" + ITEMS.filter(i => i.t === t.k).length + ")</option>")).join("");

   '<div class="grid"><section>' +
    '<div class="controls">' +
     '<div class="seg" role="group" aria-label="Question format">' +
       [["match","Matching"],["mc","Multiple choice"],["fill","Fill in the blank"]].map(([k, l]) => '<button data-f="' + k + '" aria-pressed="' + (S.fmt === k) + '">' + l + "</button>").join("") +
     "</div>" +
     '<label class="ctl">Topic <select id="topicSel">' + topOpts + "</select></label>" +
     '<label class="chk"><input type="checkbox" id="revChk"' + (S.rev ? " checked" : "") + "> Review-sheet facts only</label>" +
    "</div>" +
    (S.weak ? '<div class="banner"><span><b>Weak-spot drill.</b> Only items you have missed.</span><button class="btn small quiet" id="exitWeak">Back to all items</button></div>' : "") +
    '<div id="stage"></div>' +
   "</section><aside id=side></aside></div>";
  $("#main").querySelectorAll(".seg button").forEach(b => b.onclick = () => { S.fmt = b.dataset.f; save(); renderDrill(); });
  $("#topicSel").onchange = e => { S.topic = e.target.value; save(); renderDrill(); };
  $("#revChk").onchange = e => { S.rev = e.target.checked; save(); renderDrill(); };

}
function nextCard(){
  if (S.fmt === "match") return renderMatch();
  const p = pool(); const it = pick(p, new Set());
  if (!it) return renderEmpty();
  lastId = it.id;
  if (S.fmt === "mc") renderMC(it); else renderFill(it);
}
function renderEmpty(){
  const anyLeft = ITEMS.some(it => status(it.id) !== "ret");

function head(it){
  const r = S.items[it.id]; const lv = r && r.seen ? r.lv : 0; const tp = TOPIC[it.t];

    (it.r ? '<span class="pill rev">On review sheet</span>' : "") +

function renderMC(it){

    '<p class="hint">Press <kbd>1</kbd>–<kbd>' + opts.length + "</kbd> to answer.</p>" + '<div id="fb"></div></div>';

    if (!done && /^[1-9]$/.test(e.key)) { e.preventDefault(); choose(+e.key - 1); }

function renderFill(it){
  $("#stage").innerHTML = '<div class="card">' + head(it) + '<p class="prompt">' + esc(it.q) + "</p>" +
    '<form class="fillrow" id="ff" autocomplete="off"><input id="fi" type="text" placeholder="Type your answer" aria-label="Your answer" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Check</button></form>' +

  const inp = $("#fi"); let done = false;

  const submit = (give) => {
    if (done) return; const v = inp.value; if (!give && !v.trim()) { inp.focus(); return; }
    done = true; const g = give ? { ok: false } : grade(it, v); record(it.id, g.ok);
    inp.disabled = true; inp.classList.add(g.ok ? "right" : "wrong");
    let extra = "";
    if (!g.ok && v.trim()) extra = '<div class="sub">You wrote: ' + esc(v) + "</div>";
    if (g.ok && !g.exact) extra = '<div class="sub">Accepted: "' + esc(v) + '". Close enough, but check the exact wording.</div>';
    $("#fb").innerHTML = fbHTML(g.ok, it, extra) + nextRow();
    $("#nextBtn").onclick = nextCard;
    setTimeout(() => $("#nextBtn") && $("#nextBtn").focus({ preventScroll: true }), 0);
  };
  $("#ff").onsubmit = e => { e.preventDefault(); submit(false); };
  $("#idk").onclick = () => submit(true);
  keyHandler = e => { if (done && (e.key === "Enter" || e.key === "ArrowRight") && document.activeElement !== inp) { e.preventDefault(); nextCard(); } };
}

function renderMatch(){
  const p = pool(); const chosen = []; const ex = new Set(); const answers = new Set();
  while (chosen.length < 5) {
    const it = pick(p, ex); if (!it) break; ex.add(it.id);
    const n = norm(it.a); if (answers.has(n)) continue; answers.add(n); chosen.push(it);
  }
  if (!chosen.length) return renderEmpty();
  if (chosen.length === 1) { lastId = chosen[0].id; return renderFill(chosen[0]); }
  lastId = chosen[chosen.length - 1].id;
  const right = shuffle(chosen);
  $("#stage").innerHTML = '<div class="card"><div class="cardhead"><span>Matching · ' + chosen.length + ' pairs</span>' +
    (S.topic !== "all" ? '<span class="pill' + (TOPIC[S.topic].w === "HEAVY" ? " heavy" : "") + '">' + esc(TOPIC[S.topic].name) + "</span>" : "") + "</div>" +
    '<p class="hint" style="margin:0 0 14px">Click a prompt, then its answer. A wrong pairing counts as a miss for that prompt.</p>' +
    '<div class="mgrid"><div class="mcol"><h4>Prompt</h4>' + chosen.map(it => '<button class="mi" data-l="' + it.id + '">' + esc(it.q) + "</button>").join("") + "</div>" +
    '<div class="mcol"><h4>Answer</h4>' + right.map(it => '<button class="mi ans" data-r="' + it.id + '">' + esc(it.a) + "</button>").join("") + "</div></div>" +
    '<div class="mfb" id="fb"></div></div>';
  let selL = null, selR = null; const missed = new Set(); let left = chosen.length;
  const clear = () => { $("#stage").querySelectorAll(".mi.sel").forEach(b => b.classList.remove("sel")); };
  const tryPair = () => {
    if (!selL || !selR) return;
    const L = $('[data-l="' + selL + '"]'), R = $('[data-r="' + selR + '"]'); const it = BYID[selL];
    const ok = norm(BYID[selR].a) === norm(it.a);
    if (ok) {
      if (!missed.has(selL)) record(selL, true);
      [L, R].forEach(b => { b.classList.remove("sel"); b.classList.add("done"); if (missed.has(selL)) b.classList.add("missed"); b.disabled = true; });
      left--;
      $("#fb").innerHTML = '<div class="fb ok" role="status"><div class="verdict"><span class="mark">✓</span>' + (missed.has(selL) ? "Paired" : "Correct") + '</div><div class="ans">' + esc(it.q) + " → <b>" + esc(it.a) + '</b></div><div class="src">Source: ' + esc(SOURCES[it.s]) + "</div></div>";
    } else {
      if (!missed.has(selL)) { missed.add(selL); record(selL, false); }
      [L, R].forEach(b => { b.classList.remove("sel"); b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 350); });
      $("#fb").innerHTML = '<div class="fb no" role="status"><div class="verdict"><span class="mark">✕</span>Not quite</div><div class="ans">' + esc(it.q) + "</div>" +
        '<div class="ans">Correct answer: <b>' + esc(it.a) + '</b></div><div class="sub">You paired it with: ' + esc(BYID[selR].a) + '</div><div class="src">Source: ' + esc(SOURCES[it.s]) + "</div></div>";
    }
    selL = selR = null;
    if (!left) {
      const got = chosen.length - missed.size;
      $("#fb").innerHTML += '<div class="nextrow"><span class="hint" style="margin:0">' + got + " of " + chosen.length + ' right first try · <kbd>Enter</kbd> for next round</span><button class="btn" id="nextBtn">Next round →</button></div>';
      $("#nextBtn").onclick = renderMatch; $("#nextBtn").focus({ preventScroll: true });
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); renderMatch(); } };
    }
  };
  $("#stage").querySelectorAll("[data-l]").forEach(b => b.onclick = () => { if (b.disabled) return; $("#stage").querySelectorAll("[data-l].sel").forEach(x => x.classList.remove("sel")); selL = b.dataset.l; b.classList.add("sel"); tryPair(); });
  $("#stage").querySelectorAll("[data-r]").forEach(b => b.onclick = () => { if (b.disabled) return; $("#stage").querySelectorAll("[data-r].sel").forEach(x => x.classList.remove("sel")); selR = b.dataset.r; b.classList.add("sel"); tryPair(); });
}

/* ---------- side panel ---------- */
function renderSide(){
  const side = $("#side"); if (!side) return;
  const weak = ITEMS.filter(it => S.items[it.id] && S.items[it.id].w > 0)
    .sort((a, b) => S.items[b.id].w - S.items[a.id].w || S.items[a.id].lv - S.items[b.id].lv);
  const active = weak.filter(it => status(it.id) !== "ret");
  side.innerHTML =
   '<div class="panel"><h3>Weak spots</h3><div class="sub">Items you have missed most. Retired ones drop out of the weak-spot drill.</div>' +
    (weak.length ? '<ul class="weak">' + weak.slice(0, 15).map(it => '<li><span class="wn">' + S.items[it.id].w + "× missed</span>" +
      '<div class="wq">' + esc(it.q.length > 110 ? it.q.slice(0, 108) + "…" : it.q) + '</div><div class="wa">' + esc(it.a) + (status(it.id) === "ret" ? ' <span style="color:var(--ok);font-weight:500">· retired</span>' : "") + "</div></li>").join("") + "</ul>" +
      '<button class="btn" id="weakBtn"' + (active.length ? "" : " disabled") + ">Drill only these (" + active.length + ")</button>"
     : '<div class="empty">Nothing missed yet. Misses will collect here.</div>') +
   "</div>" +
   '<div class="panel"><h3>By topic</h3><div class="sub">Weighting from the review. Heavy topics carry most of the marks.</div><table class="tbl">' +
    TOPICS.map(t => { const list = ITEMS.filter(i => i.t === t.k); const c = counts(list);
      return "<tr><td>" + esc(t.name) + (t.w === "HEAVY" ? '<span class="hv">HEAVY</span>' : "") + '<div class="mini">' +
        LV.map(([k,, v]) => '<span style="width:' + (c[k] / list.length * 100) + "%;background:var(" + v + ')"></span>').join("") + "</div></td><td>" + c.ret + "/" + list.length + "</td></tr>"; }).join("") +
   "</table></div>" +
   '<div class="panel"><h3>Progress</h3><div class="sub">Saved in this browser. Clearing site data wipes it.</div><button class="btn small quiet danger" id="resetBtn">Reset all progress</button></div>';
  const wb = $("#weakBtn"); if (wb) wb.onclick = () => { S.weak = true; if (S.fmt === "match" && active.length < 2) S.fmt = "mc"; save(); renderDrill(); };
  $("#resetBtn").onclick = () => { if (confirm("Reset all drill and activity progress? This can't be undone.")) { S.items = {}; S.acts = {}; S.turn = 0; S.weak = false; save(); renderProgress(); route(); } };
}

/* ---------- activities ---------- */
function renderActivity(a){
  const st = S.acts[a.id] || {};
  const headHTML = '<div class="acthead"><h2>' + esc(a.title) + '</h2><div class="sub">' + esc(a.sub) +
    (st.best != null ? ' · <span class="best">Best ' + st.best + "/" + (a.qs ? a.qs.length : a.pairs.length) + "</span>" : "") + '</div><div class="note">' + esc(a.note) + "</div></div>";
  $("#main").innerHTML = '<div style="max-width:780px">' + headHTML + '<div id="astage"></div></div>';
  if (a.type === "match") return runMatchActivity(a);
  runQuiz(a);
}
function runQuiz(a){
  const order = a.qs.map((_, i) => i); let i = 0; const res = [];
  const show = () => {
    if (i >= order.length) return finish();
    const q = a.qs[order[i]]; const perm = shuffle(q.o.map((_, k) => k));
    $("#astage").innerHTML = '<div class="card"><div class="qcount"><span>Question ' + (i + 1) + " of " + order.length + "</span><span>" + res.filter(Boolean).length + ' correct</span></div>' +
      '<div class="qbar"><span style="width:' + (i / order.length * 100) + '%"></span></div>' +
      '<p class="prompt">' + esc(q.q) + '</p><div class="opts">' + perm.map((k, j) => '<button class="opt" data-j="' + j + '"><span class="k">' + (j + 1) + "</span><span>" + esc(q.o[k]) + "</span></button>").join("") + "</div>" +
      '<p class="hint">Press <kbd>1</kbd>–<kbd>' + perm.length + '</kbd> to answer.</p><div id="fb"></div></div>';
    let done = false;
    const choose = j => {
      if (done || j < 0 || j >= perm.length) return; done = true;
      const ok = perm[j] === q.c; res.push(ok);
      $("#astage").querySelectorAll(".opt").forEach((b, jj) => { b.disabled = true;
        if (perm[jj] === q.c) b.classList.add("right"); else if (jj === j) b.classList.add("wrong"); else b.classList.add("dim"); });
      $("#fb").innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '" role="status"><div class="verdict"><span class="mark">' + (ok ? "✓" : "✕") + "</span>" + (ok ? "Correct" : "Not quite") + "</div>" +
        (ok ? "" : '<div class="ans">Correct answer: <b>' + esc(q.o[q.c]) + "</b></div>") + '<div class="why">' + esc(q.why) + "</div></div>" +
        '<div class="nextrow"><span class="hint" style="margin:0"><kbd>Enter</kbd> for next</span><button class="btn" id="nextBtn">' + (i + 1 < order.length ? "Next →" : "See results") + "</button></div>";
      $("#nextBtn").onclick = () => { i++; show(); }; $("#nextBtn").focus({ preventScroll: true });
    };
    $("#astage").querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.j));
    keyHandler = e => {
      if (!done && /^[1-9]$/.test(e.key)) { e.preventDefault(); choose(+e.key - 1); }
      else if (done && (e.key === "Enter" || e.key === "ArrowRight")) { e.preventDefault(); i++; show(); }
    };
  };
  const finish = () => {
    const score = res.filter(Boolean).length; const st = S.acts[a.id] || {};
    st.last = score; st.best = Math.max(st.best || 0, score); S.acts[a.id] = st; save();
    keyHandler = null;
    $("#astage").innerHTML = '<div class="card"><p class="score">' + score + " / " + order.length + '</p><p class="hint" style="margin-top:4px">Best so far: ' + st.best + " / " + order.length + "</p>" +
      '<ul class="review">' + order.map((k, n) => { const q = a.qs[k]; return '<li class="' + (res[n] ? "" : "miss") + '"><div class="rq">' + (res[n] ? "✓ " : "✕ ") + esc(q.q) + '</div><div class="ra">' + esc(q.o[q.c]) + "</div></li>"; }).join("") + "</ul>" +
      '<div class="nextrow"><button class="btn" id="again">Retake</button></div></div>';
    $("#again").onclick = () => renderActivity(a);
  };
  show();
}
function runMatchActivity(a){
  const L = a.pairs.map((p, i) => ({ i, l: p[0] })); const R = shuffle(a.pairs.map((p, i) => ({ i, r: p[1] })));
  $("#astage").innerHTML = '<div class="card"><p class="hint" style="margin:0 0 14px">Click a term on the left, then its match on the right.</p>' +
    '<div class="mgrid"><div class="mcol"><h4>Term</h4>' + L.map(x => '<button class="mi" data-l="' + x.i + '">' + esc(x.l) + "</button>").join("") + "</div>" +
    '<div class="mcol"><h4>Match</h4>' + R.map(x => '<button class="mi ans" data-r="' + x.i + '">' + esc(x.r) + "</button>").join("") + "</div></div><div id=\"fb\" class=\"mfb\"></div></div>";
  let sl = null, sr = null; const missed = new Set(); let left = a.pairs.length;
  const tryPair = () => {
    if (sl == null || sr == null) return; const p = a.pairs[sl];
    const Lb = $('[data-l="' + sl + '"]'), Rb = $('[data-r="' + sr + '"]');
    if (sl === sr) {
      [Lb, Rb].forEach(b => { b.classList.remove("sel"); b.classList.add("done"); if (missed.has(sl)) b.classList.add("missed"); b.disabled = true; });
      left--;
      $("#fb").innerHTML = '<div class="fb ok"><div class="verdict"><span class="mark">✓</span>' + (missed.has(sl) ? "Paired" : "Correct") + '</div><div class="ans">' + esc(p[0]) + " → <b>" + esc(p[1]) + '</b></div><div class="why">' + esc(p[2]) + "</div></div>";
    } else {
      missed.add(sl);
      [Lb, Rb].forEach(b => { b.classList.remove("sel"); b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 350); });
      $("#fb").innerHTML = '<div class="fb no"><div class="verdict"><span class="mark">✕</span>Not quite</div><div class="ans">' + esc(p[0]) + " → correct match: <b>" + esc(p[1]) + '</b></div><div class="sub">You picked: ' + esc(a.pairs[sr][1]) + '</div><div class="why">' + esc(p[2]) + "</div></div>";
    }
    sl = sr = null;
    if (!left) {
      const score = a.pairs.length - missed.size; const st = S.acts[a.id] || {}; st.last = score; st.best = Math.max(st.best || 0, score); S.acts[a.id] = st; save();
      $("#fb").innerHTML += '<div class="card" style="margin-top:16px"><p class="score">' + score + " / " + a.pairs.length + '</p><p class="hint">Right on the first try. Best so far: ' + st.best + '</p><ul class="review">' +
        a.pairs.map((p, i) => '<li class="' + (missed.has(i) ? "miss" : "") + '"><div class="ra">' + esc(p[0]) + " → " + esc(p[1]) + '</div><div class="rw">' + esc(p[2]) + "</div></li>").join("") +
        '</ul><div class="nextrow"><button class="btn" id="again">Retake</button></div></div>';
      $("#again").onclick = () => renderActivity(a);
    }
  };
  $("#astage").querySelectorAll("[data-l]").forEach(b => b.onclick = () => { if (b.disabled) return; $("#astage").querySelectorAll("[data-l].sel").forEach(x => x.classList.remove("sel")); sl = +b.dataset.l; b.classList.add("sel"); tryPair(); });
  $("#astage").querySelectorAll("[data-r]").forEach(b => b.onclick = () => { if (b.disabled) return; $("#astage").querySelectorAll("[data-r].sel").forEach(x => x.classList.remove("sel")); sr = +b.dataset.r; b.classList.add("sel"); tryPair(); });
}

/* ---------- notes ---------- */
function renderNotes(){
  const bySrc = {}; ITEMS.forEach(it => bySrc[it.s] = (bySrc[it.s] || 0) + 1);
  const actBySrc = {}; ACTIVITIES.forEach(a => actBySrc[a.src] = (actBySrc[a.src] || []).concat(a.title));
  const list = arr => "<ul>" + arr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
  const revCount = ITEMS.filter(i => i.r).length;
  $("#main").innerHTML = '<div class="notes" style="max-width:820px"><h2>About this deck</h2>' +
    '<p class="hint" style="font-size:.92rem">' + ITEMS.length + " drill items, " + revCount + " of them straight from the Midterm Review (tagged 'On review sheet'). New items come up in this order: review-sheet facts from HEAVY topics first, then other review facts, then everything else. Every item cites the document it came from.</p>" +
    '<section><h3>Where the questions came from</h3><table class="srcs"><thead><tr><th>Document</th><th>Quiz tabs</th><th>Drill items</th></tr></thead><tbody>' +
      Object.keys(SOURCES).map(k => "<tr><td>" + esc(SOURCES[k]) + "</td><td>" + esc((actBySrc[k] || []).join(", ") || "—") + "</td><td>" + (bySrc[k] || 0) + "</td></tr>").join("") +
      "<tr><td>OLAP-doc.pdf (second copy)</td><td>—</td><td>Identical file; used once</td></tr></tbody></table></section>" +
    "<section><h3>Missing from your materials</h3>" + list(NOTES.missing) + "</section>" +
    "<section><h3>Named but never defined</h3>" + list(NOTES.undefined) + "</section>" +
    "<section><h3>Places your documents disagree</h3>" + list(NOTES.conflicts) + "</section>" +
    "<section><h3>Left out on purpose</h3>" + list(NOTES.skipped) + "</section></div>";
}

/* ---------- boot ---------- */
applyTheme(); renderMeta(); renderProgress(); renderTabs(); route();
})();

</script>
